services:
  web:
    build:
      context: .
      target: deps
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${DEV_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  # Producao:
  # PROD_PORT=3001 docker compose --profile prod up --build web-prod
  web-prod:
    profiles:
      - prod
    build:
      context: .
      target: runner
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
    ports:
      - "${PROD_PORT:-3000}:3000"
